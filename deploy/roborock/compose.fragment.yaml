# Merge these services, networks and volume into an existing Compose / Portainer stack.
# Build the unmodified upstream v1.2.1 image first; see README.nb.md.
services:
  roborock-mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    networks:
      - roborock_mqtt
    volumes:
      - type: bind
        source: ${ROBOROCK_SERVER_ROOT:?Set the upstream checkout path}/mqtt/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - roborock_mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "1883", "-q", "1", "-t", "roborock-health", "-n"]
      interval: 30s
      timeout: 7s
      retries: 5
      start_period: 15s
  roborock-local-server:
    image: local/roborock-local-server:1.2.1
    pull_policy: never
    restart: unless-stopped
    depends_on:
      roborock-mqtt:
        condition: service_healthy
    networks:
      - default
      - roborock_mqtt
    ports:
      - "${ROBOROCK_BIND_ADDRESS:?Set the Docker server LAN address}:555:555/tcp"
      - "${ROBOROCK_BIND_ADDRESS:?Set the Docker server LAN address}:8881:8881/tcp"
    volumes:
      - type: bind
        source: ${ROBOROCK_SERVER_ROOT:?Set the upstream checkout path}/config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ROBOROCK_SERVER_ROOT:?Set the upstream checkout path}/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${ROBOROCK_SERVER_ROOT:?Set the upstream checkout path}/secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-skf", "https://127.0.0.1:555/admin"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default: {}
  roborock_mqtt:
    internal: true

volumes:
  roborock_mqtt_data: {}
